spring:
  application:
    name: order-service
  # Virtuální vlákna záměrně vypnutá: na Java 21 Kafka consumer v poll() přišpendlí (pinning v synchronized)
  # jediné carrier vlákno při limitu 1 CPU a HTTP vč. health probe pak neodpovídá. Opraveno až v Java 24 (JEP 491).
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eda}
    username: ${DB_USERNAME:order_service}
    password: ${DB_PASSWORD:order_service}
    hikari:
      # Vlastní schéma služby (search_path) – dotazy nemusí uvádět prefix orders.
      schema: orders
      maximum-pool-size: 5
  jpa:
    # REST API nepotřebuje lazy loading ve view – spojení s DB se nedrží po celý request.
    open-in-view: false
    hibernate:
      # Schéma spravuje Flyway; Hibernate jen ověří, že entity odpovídají tabulkám.
      ddl-auto: validate
    properties:
      hibernate.default_schema: orders
  flyway:
    schemas: orders
    default-schema: orders
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Bez brokeru by se topicy nevytvořily (auto-create je na brokeru vypnutý) – raději spadnout a restartovat.
      fail-fast: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        # Konzument nezávisí na Java třídách producenta – typ určuje sám.
        spring.json.add.type.headers: false
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      # ErrorHandlingDeserializer převede nečitelnou zprávu na výjimku, kterou error handler pošle do DLT,
      # místo nekonečné smyčky v poll().
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: cz.demo.eda.order.event.PaymentResult
        spring.json.use.type.headers: false
        spring.json.trusted.packages: cz.demo.eda.order.event
    listener:
      ack-mode: record
      concurrency: 3

eda:
  kafka:
    topics:
      partitions: 3
      replicas: 1
    # Retry na úrovni Kafky – jen pro uložení do inboxu (např. nedostupná DB); business retry řeší inbox.
    retry:
      max-retries: 3
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 5s
  inbox:
    # Zpracování zpráv z inboxu: 1 + 3 retry s backoffem 0.5 s -> 1 s -> 2 s, pak <topic>.DLT.
    max-attempts: 4
    initial-backoff: 500ms
    multiplier: 2.0
    max-backoff: 5s
    batch-size: 50
    poll-interval-ms: 500
  outbox:
    poll-interval-ms: 500
  cleanup:
    # Úklid inbox/outbox: maže dokončené (PROCESSED/FAILED) a publikované zprávy starší než retention-days.
    retention-days: ${EDA_CLEANUP_RETENTION_DAYS:7}
    batch-size: 1000
    cron: "${EDA_CLEANUP_CRON:0 0 3 * * *}"

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
