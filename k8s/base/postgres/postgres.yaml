# Jedna PostgreSQL instance, databáze "eda"; každá služba má vlastní schéma a vlastního uživatele,
# který do cizího schématu nemá přístup. Hesla jsou demo hodnoty – v produkci External Secrets apod.
# Camunda má vlastní databázi camunda. Init skript běží jen nad prázdným PVC – po upgradu existujícího prostředí je nutný teardown.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
type: Opaque
stringData:
  password: postgres-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-db
type: Opaque
stringData:
  password: order-service-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-db
type: Opaque
stringData:
  password: payment-service-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: camunda-db
type: Opaque
stringData:
  password: camunda-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # Spouští se jen při inicializaci prázdného datového adresáře.
  01-service-schemas.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
         -v order_pw="$ORDER_DB_PASSWORD" -v payment_pw="$PAYMENT_DB_PASSWORD" \
         -v camunda_pw="$CAMUNDA_DB_PASSWORD" <<'EOSQL'
    CREATE ROLE order_service LOGIN PASSWORD :'order_pw';
    CREATE ROLE payment_service LOGIN PASSWORD :'payment_pw';
    -- Schéma vlastní služba; cizí role na něj nemá USAGE, takže do něj nevidí.
    CREATE SCHEMA orders AUTHORIZATION order_service;
    CREATE SCHEMA payments AUTHORIZATION payment_service;
    REVOKE ALL ON DATABASE eda FROM PUBLIC;
    GRANT CONNECT ON DATABASE eda TO order_service, payment_service;
    -- Camunda (vedlejší úložiště pro Operate) má vlastní databázi; schéma si zakládá sama.
    CREATE ROLE camunda LOGIN PASSWORD :'camunda_pw';
    CREATE DATABASE camunda OWNER camunda;
    REVOKE ALL ON DATABASE camunda FROM PUBLIC;
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          # Úsporné nastavení pro laptop (výchozí shared_buffers 128MB by se nevešel do limitu).
          args: ["-c", "shared_buffers=32MB", "-c", "max_connections=60"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: eda
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-service-db
                  key: password
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-service-db
                  key: password
            - name: CAMUNDA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camunda-db
                  key: password
          volumeMounts:
            # PostgreSQL 18 image ukládá data do /var/lib/postgresql/18/docker – mountuje se nadřazený adresář.
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "eda"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "eda"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
  # Data přežijí restart podu i redeploy; smaže je až teardown (smazání namespace).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
