apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    app.kubernetes.io/name: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.5.5
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: NODE_OPTIONS
              value: --max-old-space-size=768
            - name: TELEMETRY_OPTIN
              value: "false"
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    app.kubernetes.io/name: kibana
spec:
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: http
      port: 5601
      targetPort: http
---
# Jednorázově vytvoří Kibana data view "eda-logs-*", aby šly logy hned prohlížet v Discover.
# override=true dělá Job idempotentní při opakovaném deployi.
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-setup
  labels:
    app.kubernetes.io/name: kibana-setup
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-data-view
          image: curlimages/curl:8.22.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://kibana:5601/api/status | grep -q '"level":"available"'; do
                echo "waiting for kibana"; sleep 5
              done
              curl -sf -X POST http://kibana:5601/api/data_views/data_view \
                -H 'kbn-xsrf: true' -H 'Content-Type: application/json' \
                -d '{"override":true,"data_view":{"id":"eda-logs","name":"EDA logs","title":"eda-logs-*","timeFieldName":"@timestamp"}}'
              echo; echo "data view eda-logs-* ready"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
